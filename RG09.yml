substitutions:
  name: centralina-pioggia-rg09
  friendly_name: "Centralina pioggia"
  build_mode: "Debug"
  
esphome:
  name: $name
  friendly_name: $friendly_name
  min_version: 2025.8.2
  name_add_mac_suffix: false
  comment: "Sensore pioggia RG-09 con sensore di temperatura"
  project:
    name: "garubi.centralina-pioggia-rg09"
    version: "1.2.0-debug"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0 # disabilita il logging su UART per risparmiare memoria

debug:
  update_interval: 15s
  
# Enable Home Assistant API
api:
  reboot_timeout: 0s


# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password

wifi:
  # Configura il fallback hotspot
  ap: 
    ssid: $name
    password: !secret fallback_hotspot_password

# Aggiungi il captive portal
captive_portal:


uart:
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  # debug:
  #   direction: BOTH
  #   dummy_receiver: false
  #   after:
  #     delimiter: "\n"
  #   sequence:
  #     - lambda: UARTDebug::log_string(direction, bytes);


# Sensore RG-09 via ESPHome (componente ufficiale)
sensor:
  - platform: hydreon_rgxx
    model: RG_9
    id: hydreon_1
    update_interval: 30s
    moisture:
      name: "Livello Pioggia"
    temperature:
      name: "RG-09: temperatura sensore"
  - platform: dallas_temp
    name: "Temperatura esterna"
    update_interval: 30s
    # address: "0x1122334455667788"  # Rimuovi il commento e inserisci l'indirizzo del sensore dopo averlo identificato
    resolution: 12  # Risoluzione in bit (9-12)
    filters:
      - filter_out: nan

  - platform: debug
    free:
      name: "$friendly_name - Heap Free"

    block:
      name: "$friendly_name - Largest Free Block"

    loop_time:
      name: "$friendly_name - Loop Time"

  - platform: wifi_signal
    name: "$friendly_name - WiFi RSSI"
    update_interval: 60s

  - platform: uptime
    name: "$friendly_name - Uptime"

text_sensor:
  - platform: debug
    reset_reason:
      name: "$friendly_name - Reset Reason"

  - platform: template
    name: "$friendly_name - Build Mode"
    icon: "mdi:bug"
    update_interval: never
    lambda: |-
      return {"$build_mode"};
binary_sensor:
  - platform: hydreon_rgxx
    hydreon_rgxx_id: hydreon_1
    too_cold:
      name: "RG-09: Troppo Freddo"
    lens_bad:
      name: "RG-09: Lente Sporco"
    em_sat:
      name: "RG-09: Emettitore Saturo"

  - platform: status
    name: "$friendly_name -  Online"

# Configurazione corretta per il bus One Wire secondo la documentazione
one_wire:
  platform: gpio
  pin: GPIO32
  # id: dallas_bus  # opzionale