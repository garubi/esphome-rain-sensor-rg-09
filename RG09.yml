esphome:
  name: esphome-web-306fac
  friendly_name: ESP32rg09
  min_version: 2025.5.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:


# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);


# Sensore RG-09 via ESPHome (componente ufficiale)
sensor:
  - platform: hydreon_rgxx
    model: RG_9
    id: hydreon_1
    update_interval: 30s
    moisture:
      name: "Livello Pioggia"
    temperature:
      name: "Temperatura RG-09"

binary_sensor:
  - platform: hydreon_rgxx
    hydreon_rgxx_id: hydreon_1
    too_cold:
      name: "RG-09: Troppo Freddo"
    lens_bad:
      name: "RG-09: Lente Sporco"
    em_sat:
      name: "RG-09: Emettitore Saturo"